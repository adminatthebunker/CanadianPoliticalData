user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    # Use Docker's embedded DNS (127.0.0.11) as the resolver. Combined
    # with variable-based proxy_pass in the per-location blocks, this
    # forces nginx to re-resolve upstream container names on each
    # request (TTL `valid=10s`). Without this nginx caches the
    # first-seen IP at config-load time and serves 502s for ~30s after
    # any `docker compose up -d --build api` until manually restarted.
    # ipv6=off because Docker's embedded DNS returns AAAA-records that
    # don't route, which costs an unnecessary lookup per request.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ─────────────────────────────────────────────────────────────────
    # Real client IP recovery. Public traffic arrives Pangolin → Newt →
    # nginx, so without this every request's $remote_addr is the Newt
    # container and all clients collapse into one identity — which makes
    # per-IP rate limiting, log analysis and abuse tracing meaningless.
    #
    # Pangolin sets X-Forwarded-For to the real client. We trust that
    # header ONLY when the peer is inside the Docker private range, so a
    # public client cannot forge it: the header is ignored unless it
    # arrived through our own tunnel.
    #
    # ⚠ real_ip_recursive MUST stay `off`. With it on, nginx walks right
    #   to left through the whole chain and lands on the LEFTMOST entry —
    #   which is the attacker-supplied value when a client sends its own
    #   X-Forwarded-For and Traefik appends the real address to the right
    #   of it. `off` takes the rightmost untrusted entry, which is the
    #   address Pangolin itself observed. That distinction is the whole
    #   difference between a rate limit and a rate suggestion.
    # ─────────────────────────────────────────────────────────────────
    # ⚠ 172.16.0.0/12, not the exact 172.19.0.0/16, because docker-compose.yml
    #   pins no `ipam` subnet for the `sw` network — Docker draws it from the
    #   default pool (172.17–172.31) and may reassign a different /16 if the
    #   network is ever recreated. The breadth is deliberate; narrowing it
    #   safely means pinning the subnet in compose first, which needs a full
    #   stack restart. See docs/operations.md § Crawler policy.
    #
    #   What this range trusts is every container on `sw` PLUS the bridge
    #   gateway (172.19.0.1) — which is what the 127.0.0.1 host publish NATs
    #   through, so a LOCAL process can still set its own X-Forwarded-For.
    #   Bounded: nothing in the codebase uses req.ip for authz, only as an
    #   anti-abuse bucket key. `sw-api` publishes no port, and Docker's default
    #   inter-network isolation blocks other bridge networks from reaching it.
    set_real_ip_from 172.16.0.0/12;
    # Inert in the current topology — the port publish NATs through the gateway
    # above, so nginx's peer is never literally 127.0.0.1. Kept for a host-
    # network or unix-socket deployment; do not read it as extra protection.
    set_real_ip_from 127.0.0.1;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive off;



    # ─────────────────────────────────────────────────────────────────
    # Crawler controls. See nginx/robots.txt for the polite half and the
    # measured traffic that motivated this; these two must stay in sync.
    #
    # ⚠ $ua_ai_trainer matches AI *training* crawlers only. It must never
    #   match a search or citation crawler:
    #     GoogleOther        ≠ Googlebot          (search — allowed)
    #     Applebot-Extended  ≠ Applebot           (Siri search — allowed)
    #     ClaudeBot          ≠ Claude-SearchBot   (citation — allowed)
    #     GPTBot             ≠ OAI-SearchBot      (citation — allowed)
    #   Each pair is a prefix relationship, so a sloppier regex silently
    #   de-indexes us. Add new entries with that in mind.
    # ─────────────────────────────────────────────────────────────────
    map $http_user_agent $ua_ai_trainer {
        default                   0;
        "~*meta-externalagent"    1;
        "~*meta-externalfetcher"  1;
        "~*FacebookBot"           1;
        "~*GoogleOther"           1;
        "~*Google-Extended"       1;
        "~*GPTBot"                1;
        "~*ClaudeBot"             1;
        "~*anthropic-ai"          1;
        "~*Claude-Web"            1;
        "~*CCBot"                 1;
        "~*Bytespider"            1;
        "~*Amazonbot"             1;
        "~*Applebot-Extended"     1;
        "~*cohere-ai"             1;
        "~*Diffbot"               1;
        "~*ImagesiftBot"          1;
        "~*Omgilibot"             1;
        "~*PanguBot"              1;
        "~*Timpibot"              1;
        "~*AI2Bot"                1;
        "~*YouBot"                1;
        "~*Webzio-Extended"       1;
        "~*Scrapy"                1;
    }

    # ─────────────────────────────────────────────────────────────────
    # Abusive networks, matched by ADDRESS rather than User-Agent.
    #
    # Every other control in this file keys off $http_user_agent, which
    # only works against a crawler that identifies itself. On 2026-10-26 a
    # farm on 45.61.91.0/24 — 251 distinct source IPs, rotating so no
    # single address looks abusive — walked /search?anchor_chunk_id=<uuid>
    # at ~1,050 req/min behind a plain "Chrome/145 on X11 Linux" UA. It
    # matched none of the maps above because it claimed to be a browser.
    #
    # Each page load fans out into seven /api/v1 calls, one of which
    # (/search/meta) was an uncached COUNT(*) over the 58 GB speech_chunks
    # heap. 31 of those scans ran concurrently; sw-db held ~830% CPU and
    # the host reached 96°C against a 100°C critical threshold.
    #
    # ⚠ This relies on the real_ip recovery configured above. With
    #   set_real_ip_from mis-scoped, $remote_addr is the Newt container and
    #   this map matches nothing — the block and the rate limit fail
    #   together and silently. Verify with a logged request, not by
    #   reading the config.
    #
    # ⛔ A /24 is the widest unit that is safe to deny outright here, and
    #   only because this one is a hosting range with no plausible human
    #   traffic. Do not widen to a /16 or add a range you have not seen in
    #   the access log: the entries below are evidence-based, and an
    #   aspirational one eventually blocks a real constituent.
    geo $abusive_net {
        default        0;
        45.61.91.0/24  1;   # 2026-10-26 Hansard chunk-walker, 251 IPs
    }

    # ⛔ A blocked crawler must still be able to READ /robots.txt, or it
    #    only ever learns "this host 403s" and has no machine-readable
    #    reason to back off. Some crawlers retry a 403 harder than they
    #    retry an honoured Disallow. Hence the two-variable combination
    #    below rather than a server-level `if`, which runs in the rewrite
    #    phase and would swallow the robots.txt request as well.
    map $request_uri $robots_txt_req {
        default            0;
        "~^/robots\.txt"   1;
    }
    map "$ua_ai_trainer$robots_txt_req" $block_ai {
        default 0;
        "10"    1;   # trainer UA, and not asking for robots.txt
    }

    # Same robots.txt carve-out as $block_ai, for the same reason: a bare
    # 429 teaches a scraper nothing, and some retry it harder than they
    # retry an honoured Disallow.
    map "$abusive_net$robots_txt_req" $block_abusive {
        default 0;
        "10"    1;   # abusive network, and not asking for robots.txt
    }

    # Broad self-declared-crawler match, used ONLY to keep bots out of
    # /api/. The API returns the same data the HTML already carries, for
    # the SPA's own XHR; half of Meta's 272k daily requests were landing
    # there because the crawler executes our JavaScript and follows the
    # fetch calls. First matching regex wins, so the monitor exemption
    # leads (Uptime-Kuma does not match the generic pattern today — the
    # entry is defensive against a future UA change).
    map $http_user_agent $is_crawler {
        default                        0;
        "~*Uptime-Kuma"                0;
        "~*(bot|crawler|spider|slurp)" 1;
    }

    # ⛔ Search and citation crawlers MUST reach /api/. The frontend is a
    #    client-rendered SPA — / returns 1.8 KB containing <div id="root">
    #    and nothing else, and every page's content arrives over /api/v1/*.
    #    403 the API for Googlebot and it renders an empty page, concludes
    #    there is no content, and de-indexes the site. Verified 2026-08-29.
    #
    #    This is the inverse of the usual advice, which assumes server-
    #    rendered HTML. Do not "harden" this by removing the exemption
    #    unless the frontend has gained SSR or prerendering.
    map $http_user_agent $ua_search_ok {
        default                0;
        "~*Googlebot"          1;
        "~*bingbot"            1;
        "~*Applebot"           1;
        "~*DuckDuckBot"        1;
        "~*YandexBot"          1;
        "~*OAI-SearchBot"      1;
        "~*ChatGPT-User"       1;
        "~*PerplexityBot"      1;
        "~*Perplexity-User"    1;
        "~*Claude-SearchBot"   1;
        "~*Claude-User"        1;
    }

    # Declared crawler AND not an allowed search engine. The residual set
    # is SEO/backlink scrapers (Ahrefs, Semrush, MJ12, DotBot) — real load,
    # no benefit. AI trainers never reach this test: $block_ai already 403s
    # them at the server level, in the earlier rewrite phase.
    map "$is_crawler$ua_search_ok" $block_api_crawler {
        default 0;
        "10"    1;
    }

    # ─────────────────────────────────────────────────────────────────
    # Rate limiting for /api/. Applied in location /api/ (default.conf).
    #
    # ⛔ THE SUBNET ZONE IS THE LOAD-BEARING ONE. Do not "simplify" this to
    #    a single per-IP zone. Measured during the 2026-10-26 incident:
    #
    #                        peak per IP    peak per /24
    #      legit humans         ~15/min        ~26/min
    #      Googlebot            ~41/min        ~45/min
    #      the crawler farm      17/min      ~1050/min
    #
    #    The farm spread 1,050 req/min across 251 addresses, so each single
    #    IP sat at 17/min — BELOW legitimate human traffic. No per-IP
    #    threshold could have caught it without breaking the site: one
    #    search page load fans out into seven /api/v1 calls, so a real user
    #    briefly exceeds any limit tight enough to matter. Aggregating by
    #    /24 is what turns a 0x signal into a 40x one.
    #
    # Thresholds are set from the measurements above with ~8-9x headroom
    # over observed legitimate peaks, not from intuition. Re-measure before
    # changing them; the awk one-liners are in docs/operations.md.
    #
    # ⚠ CGNAT is the known weakness of the /24 axis. Mobile carriers put
    #   many real users behind few addresses, so a popular day on one
    #   carrier range could trip a limit that today has 9x headroom. It
    #   returns 429 (not 403) precisely so a normal client backs off and
    #   retries rather than seeing a hard failure. If this starts firing on
    #   a carrier range, raise it from the log evidence — do not delete the
    #   zone, which is the only axis that sees a distributed farm.
    #
    # ⚠ Only /api/ is limited, not the SPA shell or /assets/. The farm also
    #   pulled /search and the JS bundle, but those are static and cheap;
    #   /api/ is the surface that reaches Postgres. Widening this to
    #   location / would put every asset fetch in the same bucket as the
    #   fan-out that loads them, which is how a limit starts breaking real
    #   page loads.
    # ─────────────────────────────────────────────────────────────────

    # ⛔ EXEMPTIONS APPLY TO THE PER-IP ZONE ONLY. The subnet zone counts
    #    EVERY request, with no exemption of any kind, and that asymmetry is
    #    deliberate — it is what keeps the whole scheme from being one
    #    forged header away from useless.
    #
    #    Both exemption signals below are client-supplied and unverifiable
    #    here: nginx cannot authenticate an API token, and any scraper can
    #    send "User-Agent: Googlebot". Verified 2026-10-26 — a forged
    #    "Authorization: Bearer cpd_live_forged_deadbeef" passed 60/60
    #    requests when the exemption covered both zones. So forging one buys
    #    an attacker relief from the 2r/s per-IP zone and nothing else; they
    #    still land in the 6r/s subnet aggregate, which is the control that
    #    actually sees a distributed farm.
    #
    #    Do not "tidy" this by applying $api_limited to the subnet key.
    map $http_user_agent $ua_monitor {
        default          0;
        "~*Uptime-Kuma"  1;   # our own health checks
    }

    # Bearer tokens get per-IP relief because the pro tier is 10,000 req/h
    # (~2.8 r/s) from a single customer server — above the 2r/s per-IP rate,
    # so without this nginx would throttle a paying customer below the tier
    # they bought. api-rate-limit.ts remains the authoritative per-tier
    # meter; see the api_key zone below for the backstop.
    map "$ua_search_ok$ua_monitor$http_authorization" $api_ip_exempt {
        default          0;
        "~^1"            1;   # search/citation crawler
        "~^.1"           1;   # uptime monitor
        "~^..Bearer\s"   1;   # bearer token
    }

    map $api_ip_exempt $api_limit_ip {
        1  "";
        0  $binary_remote_addr;
    }

    # /24 aggregation key — the load-bearing one. No exemption branch.
    #
    # ⚠ IPv4 only. nginx cannot slice $binary_remote_addr, and text-slicing
    #   an IPv6 address is unsound because $remote_addr renders compressed
    #   ("2001:db8::1"), so the /64 cannot be recovered without expanding
    #   it. IPv6 falls back to the full address, leaving it covered by the
    #   per-IP zone only. Acceptable TODAY on evidence: 0 of 225,385
    #   requests over 24h arrived over IPv6. NOT acceptable once IPv6
    #   traffic appears — one customer holds a /64 and can rotate 2^64
    #   addresses, which makes per-IP limiting meaningless there. Revisit
    #   with a real normalizer at that point.
    map $remote_addr $api_limit_net {
        "~^(?<net4>\d+\.\d+\.\d+)\.\d+$"  $net4;
        default                                $remote_addr;
    }

    # Per-token backstop for the paid /api/public/v1 surface. Keyed on the
    # token so a single hammering key is bounded; set well above the pro
    # tier so api-rate-limit.ts stays authoritative.
    map $http_authorization $api_limit_token {
        default        "";
        "~^Bearer\s"   $http_authorization;
    }

    # Headroom against the measurements above:
    #   per-IP  2r/s  — humans peak 0.25 r/s (8x), crawlers/bearer exempt
    #   subnet  6r/s  — humans 0.43 r/s (14x), Googlebot 0.75 r/s (8x),
    #                   pro tier 2.8 r/s (2.1x), the farm 17.5 r/s (BLOCKED)
    # The subnet rate is pinned between the pro tier below it and the farm
    # above it. Moving it needs both bounds rechecked, not just one.
    limit_req_zone $api_limit_ip    zone=api_ip:10m   rate=2r/s;
    limit_req_zone $api_limit_net   zone=api_net:10m  rate=6r/s;
    limit_req_zone $api_limit_token zone=api_key:5m   rate=20r/s;

    # 429, not the 503 default: this is a volume objection, not a server
    # fault, and 503 tells a client (and an uptime monitor) the wrong thing.
    # Google treats 429 as "slow down" and reduces crawl rate; it does not
    # de-index for it the way it would for a persistent 403.
    limit_req_status 429;
    limit_req_log_level warn;

    include /etc/nginx/conf.d/*.conf;
}
