server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 2m;

    # ── Crawler policy ───────────────────────────────────────────────
    # Maps live in nginx.conf. Served from a file rather than the SPA
    # because the catch-all `location /` proxies unknown paths to the
    # frontend, which answered /robots.txt with 200 + index.html — a
    # crawler parses that as "no rules" and crawls everything.
    location = /robots.txt {
        alias /etc/nginx/robots.txt;
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
        # ⚠ Deliberately LOGGED. This was `access_log off` for one day and it
        # removed the only signal that distinguishes "the crawler read our
        # policy and backed off" from "the crawler is still hammering us and
        # merely absorbing 403s". Those need different responses — the second
        # escalates to Pangolin-level rate limiting — so the fetch must be
        # visible. It is a handful of requests a day; the noise is not real.
    }

    # $block_ai is 0 for a /robots.txt request even from a blocked UA,
    # so a declined crawler can always read why. See nginx.conf.
    if ($block_ai) {
        return 403 "Blocked: AI training crawler. See /robots.txt\n";
    }

    # Address-based block for abusive networks that spoof a browser UA, so
    # none of the $block_ai / $block_api_crawler maps can see them. Ranges
    # and the incident that motivated this are in nginx.conf § Abusive
    # networks. 429 + Retry-After rather than 403: this is a volume
    # objection, not a policy one, and a well-built client backs off.
    # ⚠ No Retry-After header: a server-level `if` runs in the rewrite phase
    # and permits only return/rewrite, so add_header is rejected at config
    # load. Setting one means an internal redirect to a named location —
    # not worth it for a range we intend to keep denied.
    if ($block_abusive) {
        return 429 "Rate limited: excessive automated requests from your network. See /robots.txt\n";
    }

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # ─────────────────────────────────────────────────────────────────
    # Blog → docs site. The MDX-in-React blog was migrated to the MkDocs
    # Material blog plugin; URLs preserve the slug 1:1, so a permanent
    # redirect cleanly handles old inbound links and bookmarks.
    # ─────────────────────────────────────────────────────────────────
    location = /blog          { return 301 https://docs.canadianpoliticaldata.org/blog/; }
    location = /blog/         { return 301 https://docs.canadianpoliticaldata.org/blog/; }
    location ~ ^/blog/([^/]+)/?$ {
        return 301 https://docs.canadianpoliticaldata.org/blog/$1/;
    }

    # API. Variable-based proxy_pass forces re-resolution through the
    # http{} resolver — survives api-container recreates without an
    # nginx restart. See nginx.conf for the resolver config.
    location /api/ {
        # Blocks bulk scrapers only. Half of Meta's 272k daily requests
        # landed here, and SEO/backlink crawlers add more, because a
        # crawler that executes our JavaScript then follows the fetch calls.
        #
        # ⚠ Search/citation engines are EXEMPT. The frontend is client-
        # rendered, so /api/ IS the content — 403ing it for Googlebot
        # de-indexes the site. See $ua_search_ok in nginx.conf.
        if ($block_api_crawler) { return 403; }

        # Rate limiting. Zones, keys, exemptions and the measurements the
        # thresholds come from are in nginx.conf § Rate limiting for /api/.
        #
        # Burst sizes absorb the SPA's fan-out: one /search page load fires
        # seven /api/v1 calls at once (me, search/meta, search/facets,
        # search/speeches, search/speeches/count, reports/meta,
        # contradictions/meta), and typing in the search box fires three per
        # debounce tick. nodelay serves the burst immediately rather than
        # queueing it — without nodelay a legitimate page load would be
        # paced out over 15s at 2r/s and feel broken.
        limit_req zone=api_ip  burst=30  nodelay;
        limit_req zone=api_net burst=120 nodelay;
        limit_req zone=api_key burst=200 nodelay;

        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwrite, not append: $remote_addr is already the real client
        # (recovered by real_ip in nginx.conf), so the API receives exactly
        # one trusted value instead of a chain it has to reason about.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Health
    location = /health {
        # Same XFF overwrite as /api/. Not strictly required today — the API's
        # CIDR-allowlist trustProxy walks a raw chain correctly on its own — but
        # without it this route depends on that ONE mechanism, where /api/ is
        # protected by two independent ones. If trustProxy were ever loosened
        # back to `true`, /api/ would still hold and /health would silently
        # regain the original forgery bug, on the least-tested, most-hit route.
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream/health;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Locally-mirrored binary assets (politician portraits, etc).
    # Backed by the `assets` named volume, RW-written by the scanner
    # service and RO-mounted here. See db/migrations/0026 and
    # docs/plans/sovereignty-runtime-deps.md.
    #
    # Scoped to /assets/politicians/ so it does not shadow Vite's
    # build output (the frontend emits hashed bundles to /assets/*).
    # Anything else under /assets/ falls through to the frontend.
    location /assets/politicians/ {
        alias /var/www/assets/politicians/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
        access_log off;
    }

    # Uptime Kuma under /status/ (optional)
    location /status/ {
        set $kuma_upstream http://uptime-kuma:3001;
        proxy_pass $kuma_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Frontend
    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
