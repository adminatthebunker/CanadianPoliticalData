server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 2m;

    # ── Crawler policy ───────────────────────────────────────────────
    # Maps live in nginx.conf. Served from a file rather than the SPA
    # because the catch-all `location /` proxies unknown paths to the
    # frontend, which answered /robots.txt with 200 + index.html — a
    # crawler parses that as "no rules" and crawls everything.
    location = /robots.txt {
        alias /etc/nginx/robots.txt;
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    # $block_ai is 0 for a /robots.txt request even from a blocked UA,
    # so a declined crawler can always read why. See nginx.conf.
    if ($block_ai) {
        return 403 "Blocked: AI training crawler. See /robots.txt\n";
    }

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # ─────────────────────────────────────────────────────────────────
    # Blog → docs site. The MDX-in-React blog was migrated to the MkDocs
    # Material blog plugin; URLs preserve the slug 1:1, so a permanent
    # redirect cleanly handles old inbound links and bookmarks.
    # ─────────────────────────────────────────────────────────────────
    location = /blog          { return 301 https://docs.canadianpoliticaldata.org/blog/; }
    location = /blog/         { return 301 https://docs.canadianpoliticaldata.org/blog/; }
    location ~ ^/blog/([^/]+)/?$ {
        return 301 https://docs.canadianpoliticaldata.org/blog/$1/;
    }

    # API. Variable-based proxy_pass forces re-resolution through the
    # http{} resolver — survives api-container recreates without an
    # nginx restart. See nginx.conf for the resolver config.
    location /api/ {
        # Blocks bulk scrapers only. Half of Meta's 272k daily requests
        # landed here, and SEO/backlink crawlers add more, because a
        # crawler that executes our JavaScript then follows the fetch calls.
        #
        # ⚠ Search/citation engines are EXEMPT. The frontend is client-
        # rendered, so /api/ IS the content — 403ing it for Googlebot
        # de-indexes the site. See $ua_search_ok in nginx.conf.
        if ($block_api_crawler) { return 403; }
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwrite, not append: $remote_addr is already the real client
        # (recovered by real_ip in nginx.conf), so the API receives exactly
        # one trusted value instead of a chain it has to reason about.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Health
    location = /health {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream/health;
    }

    # Locally-mirrored binary assets (politician portraits, etc).
    # Backed by the `assets` named volume, RW-written by the scanner
    # service and RO-mounted here. See db/migrations/0026 and
    # docs/plans/sovereignty-runtime-deps.md.
    #
    # Scoped to /assets/politicians/ so it does not shadow Vite's
    # build output (the frontend emits hashed bundles to /assets/*).
    # Anything else under /assets/ falls through to the frontend.
    location /assets/politicians/ {
        alias /var/www/assets/politicians/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
        access_log off;
    }

    # Uptime Kuma under /status/ (optional)
    location /status/ {
        set $kuma_upstream http://uptime-kuma:3001;
        proxy_pass $kuma_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Frontend
    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
